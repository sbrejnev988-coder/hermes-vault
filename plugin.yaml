name: hermes-vault
version: 1.0.0
description: "AEAD secret management for Hermes Agent — ChaCha20Poly1305 wrapping, key rotation, XOR legacy fallback, zero dependencies (stdlib-only Python). Integrates with memory-wiki for redacted secret references."
author: "sbrejnev988-coder"
license: "MIT"

hooks:
  - pre_llm_call

provides_tools:
  - vault_wrap
  - vault_unwrap
  - vault_rotate_key
  - vault_migrate
  - vault_health

provides_modules:
  - vault
  - vault_aead